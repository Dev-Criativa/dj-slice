name = "event-engine"
main = "src/index.js"
compatibility_date = "2026-11-24"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[[d1_databases]]
binding = "DB"
database_name = "event-engine-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
[vars]
EVENT_CODE = "PARTY2026"
EVENT_TITLE = "Your Event"
