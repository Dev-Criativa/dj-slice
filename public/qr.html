<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evento — Acesso</title><link rel="stylesheet" href="/style.css"><main class="screen qr-screen"><small>ACESSO AO EVENTO</small><h1>Entra<br><em>na festa.</em></h1><p id="eventName">A carregar evento…</p><div id="qr" class="qr-box"></div><p class="url" id="guestUrl"></p><p>Lê o código com a câmara do telemóvel.</p></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const code=new URLSearchParams(location.search).get('event')||'PARTY2026';const url=location.origin+'/guest?event='+encodeURIComponent(code);document.querySelector('#guestUrl').textContent=url;new QRCode(document.querySelector('#qr'),{text:url,width:280,height:280});fetch('/api/'+encodeURIComponent(code)+'/state').then(r=>r.json()).then(d=>{document.querySelector('#eventName').textContent=d.event.title;document.title=d.event.title+' — Acesso';}).catch(()=>document.querySelector('#eventName').textContent='Evento indisponível');</script></html>
