<!doctype html>
<html lang="pt-PT">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evento — Projecção</title>
<link rel="stylesheet" href="/style.css">
<main class="screen room-screen">
  <header class="room-header"><b id="event-brand">PEDE &amp; FATIA</b><small id="moment">M1</small></header>
  <h1 id="headline">A festa também é do público.</h1>
  <div id="body">A aguardar o momento activo.</div>
  <aside id="join-qr" class="join-qr" aria-label="Entrar na festa"><div class="join-qr-copy"><small>ENTRA NA FESTA</small><strong>Aponta a câmara<br>e participa.</strong></div><div id="projector-qr" class="projector-qr"></div></aside>
  <section id="dashboard" class="room-dashboard">
    <article class="room-panel" id="primary-panel">
      <small id="primary-label">TOP MÚSICAS</small>
      <div id="primary-content"></div>
    </article>
    <article class="room-panel" id="messages-panel">
      <small>FARMA AURA</small>
      <div id="messages-content"></div>
    </article>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="/room.js"></script>
</html>
